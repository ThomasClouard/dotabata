<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dotabata! — party game LAN</title>
  <style>
    :root { --ink: #2b2140; --card: rgba(255, 255, 255, 0.94); --accent: #ff4d6d; --accent2: #4361ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .card { background: var(--card); border-radius: 18px; box-shadow: 0 8px 0 rgba(43, 33, 64, 0.18); padding: 16px 18px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 1px; color: var(--accent); text-shadow: 2px 2px 0 #ffd60a; }
    h2 { margin: 14px 0 6px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); }
    h3 { margin: 10px 0 4px; font-size: 14px; }
    button { font: inherit; font-weight: bold; border: 0; border-radius: 12px; padding: 8px 14px; background: #ffd60a; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 rgba(43, 33, 64, 0.25); }
    button:hover { filter: brightness(1.07); }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 33, 64, 0.25); }
    button.big { width: 100%; font-size: 20px; padding: 12px; background: var(--accent); color: #fff; margin-top: 12px; }
    button.sel { outline: 3px solid var(--accent2); }
    button.small { padding: 3px 10px; }
    input, select { font: inherit; border: 2px solid #cfc7e6; border-radius: 10px; padding: 5px 8px; background: #fff; color: var(--ink); }
    input[type="number"] { width: 78px; }
    input:disabled, select:disabled { background: #eee; color: #777; }
    #lobby { position: fixed; left: 14px; top: 14px; bottom: 14px; width: 360px; overflow-y: auto; display: none; }
    #lobby .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; flex-wrap: wrap; }
    #lobby .row > label { flex: 1; min-width: 120px; font-size: 14px; }
    #lobby small { display: block; color: #6b6288; margin-top: 8px; line-height: 1.4; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
    .swatch.sel { outline: 3px solid var(--ink); }
    .player { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-weight: bold; }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid rgba(0, 0, 0, 0.25); flex: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips label { background: #efeaff; border-radius: 10px; padding: 3px 8px; font-size: 13px; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-weight: bold; }
    #hud .top { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 20px; text-align: center; white-space: nowrap; }
    #hud .side { position: absolute; top: 12px; right: 12px; padding: 10px 14px; font-size: 14px; min-width: 170px; }
    #hud .bottom { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 18px; font-size: 15px; text-align: center; }
    .bar { height: 10px; border-radius: 6px; background: #ddd; overflow: hidden; margin: 2px 0 6px; }
    .bar > i { display: block; height: 100%; background: #70e000; border-radius: 6px; }
    .mat { display: inline-block; padding: 4px 10px; border-radius: 10px; margin: 0 3px; background: #eee; }
    .mat.sel { background: #ffd60a; }
    #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; text-align: center; }
    #banner .title { font-size: 54px; font-weight: 900; color: #fff; text-shadow: 4px 4px 0 var(--accent), -2px -2px 0 var(--ink); }
    #banner .sub { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 var(--ink); max-width: 640px; }
    #banner .count { font-size: 120px; font-weight: 900; color: #ffd60a; text-shadow: 6px 6px 0 var(--ink); line-height: 1.1; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43, 33, 64, 0.35); }
    #overlay .card { min-width: 420px; max-width: 90vw; max-height: 90vh; overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 4px 8px; font-weight: bold; }
    td.num { text-align: right; }
    tr.me td { background: #fff3b0; }
    #toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900; color: #fff; text-shadow: 3px 3px 0 var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.25s; text-align: center; }
    #corner { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: #fff; text-shadow: 1px 1px 0 var(--ink); pointer-events: none; }
    #stop { position: fixed; right: 12px; bottom: 12px; display: none; }
    #wait { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
    /* écran de chargement : Dotabata! + ドタバタ dessiné en traits (pas de police japonaise requise) */
    #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(160deg, #ff8fab 0%, #c77dff 55%, #4361ee 100%); transition: opacity 0.5s, transform 0.5s; text-align: center; }
    #splash.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
    #splash .logo { font-size: clamp(54px, 13vw, 120px); font-weight: 900; color: #ffd60a; letter-spacing: 2px; text-shadow: 5px 5px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); line-height: 1; }
    #splash .logo span { display: inline-block; animation: hop 0.9s ease-in-out infinite; }
    #splash svg { width: min(78vw, 420px); height: auto; overflow: visible; }
    #splash .kana { animation: hop 0.9s ease-in-out infinite; }
    #splash .ink { fill: none; stroke: var(--ink); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
    #splash .fill { fill: none; stroke: #fff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    #splash .sub { font-size: 18px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 var(--ink); padding: 0 16px; }
    #splash .load { font-size: 14px; color: #fff; opacity: 0.85; text-shadow: 1px 1px 0 var(--ink); animation: blink 1.2s ease-in-out infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(2px) rotate(3deg); } }
    @keyframes blink { 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="banner"><div class="title"></div><div class="sub"></div><div class="count"></div></div>
  <div id="toast"></div>
  <div id="lobby" class="card"></div>
  <div id="overlay"><div class="card"></div></div>
  <div id="wait"><div class="card">Partie en cours… tu rejoins à la prochaine manche !</div></div>
  <div id="corner"></div>
  <button id="stop" class="small">⏹ Arrêter la partie</button>
  <div id="splash">
    <div class="logo"><span style="animation-delay:0.00s">D</span><span style="animation-delay:0.07s">o</span><span style="animation-delay:0.14s">t</span><span style="animation-delay:0.21s">a</span><span style="animation-delay:0.28s">b</span><span style="animation-delay:0.35s">a</span><span style="animation-delay:0.42s">t</span><span style="animation-delay:0.49s">a</span><span style="animation-delay:0.56s">!</span></div>
    <svg viewBox="-12 -12 454 124" role="img" aria-label="ドタバタ"><g transform="translate(0 0)"><g class="kana" style="animation-delay:0s"><path class="ink" d="M40 8 L40 95 M42 44 L76 64 M74 6 L82 22 M88 2 L96 18"/><path class="fill" d="M40 8 L40 95 M42 44 L76 64 M74 6 L82 22 M88 2 L96 18"/></g></g><g transform="translate(110 0)"><g class="kana" style="animation-delay:0.12s"><path class="ink" d="M46 6 L20 44 M34 26 L80 26 Q74 66 32 96 M34 50 L66 68"/><path class="fill" d="M46 6 L20 44 M34 26 L80 26 Q74 66 32 96 M34 50 L66 68"/></g></g><g transform="translate(220 0)"><g class="kana" style="animation-delay:0.24s"><path class="ink" d="M36 28 L10 82 M60 28 Q78 52 92 82 M74 6 L82 22 M88 2 L96 18"/><path class="fill" d="M36 28 L10 82 M60 28 Q78 52 92 82 M74 6 L82 22 M88 2 L96 18"/></g></g><g transform="translate(330 0)"><g class="kana" style="animation-delay:0.36s"><path class="ink" d="M46 6 L20 44 M34 26 L80 26 Q74 66 32 96 M34 50 L66 68"/><path class="fill" d="M46 6 L20 44 M34 26 L80 26 Q74 66 32 96 M34 50 L66 68"/></g></g></svg>
    <div class="sub">« do-ta-ba-ta » : le joyeux chahut, en japonais</div>
    <div class="load">Chargement…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
