# Compile Dotabata.exe sur GitHub (Windows, avec compiler.cmd).
# - tag « v* » poussé (git tag v1.2.0 && git push origin v1.2.0) : compile, puis publie une version GitHub
#   (onglet Releases) avec Dotabata.exe à télécharger ; le numéro du tag est inscrit dans l'exe et affiché
#   sur l'écran titre ;
# - pull request ou lancement à la main (onglet Actions) : compile seulement, l'exe est dans les artefacts.
name: Compilation de l'exe

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publier la version

env:
  GODOT_VERSION: 4.7.2-stable       # version publiée de Godot (doit correspondre à celle du projet)
  GODOT_TEMPLATES: 4.7.2.stable     # nom du dossier des modèles d'export

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "godot"
          curl.exe -L --fail -o godot.zip "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath $dir
          Remove-Item godot.zip
          # Le lanceur console relance l'exe principal posé à côté de lui, trouvé d'après son propre nom :
          # godot_console.exe cherche godot.exe, d'où les deux copies.
          $console = Get-ChildItem $dir -Recurse -Filter "*_console.exe" | Select-Object -First 1
          $main = Get-ChildItem $dir -Recurse -Filter "Godot_v*_win64.exe" | Select-Object -First 1
          Copy-Item $console.FullName (Join-Path $dir "godot_console.exe")
          Copy-Item $main.FullName (Join-Path $dir "godot.exe")
          & (Join-Path $dir "godot_console.exe") --version
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Les modèles d'export (1,3 Go à télécharger) : seuls ceux de Windows sont gardés d'une compilation à l'autre.
      - name: Modèles d'export (cache)
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_TEMPLATES }}\version.txt
            ~\AppData\Roaming\Godot\export_templates\${{ env.GODOT_TEMPLATES }}\windows_*
          key: godot-templates-windows-${{ env.GODOT_TEMPLATES }}

      - name: Numéro de version (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+){0,3}$') { throw "Tag « $env:GITHUB_REF_NAME » : il faut la forme v1.2.3" }
          $p = "godot/project.godot"
          (Get-Content -Raw $p) -replace '\[application\]', "[application]`n`nconfig/version=`"$v`"" | Set-Content -NoNewline -Encoding utf8 $p
          Select-String -Path $p -Pattern "config/version"

      - name: Compiler
        shell: cmd
        run: call compiler.cmd

      - name: Exe en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dotabata-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.run_number }}
          path: godot/build/windows/Dotabata.exe
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Télécharge **Dotabata.exe** ci-dessous : c'est le seul fichier nécessaire (Windows 64 bits).
          Au premier lancement, autorise Dotabata! sur les réseaux privés quand Windows le demande, et choisis
          « Exécuter quand même » si SmartScreen s'affiche. Tous les joueurs doivent avoir la même version.
          "@
          gh release create "$env:GITHUB_REF_NAME" godot/build/windows/Dotabata.exe --title "Dotabata! $env:GITHUB_REF_NAME" --notes $notes --verify-tag
